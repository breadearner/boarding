<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登機廣播看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  /* 版面：機場出境機械翻牌看板（FIDS）。經典深黑霧面金屬機殼＋內凹深色字槽＋機場黃（#f5c518）標誌燈號 */
  :root {
    --case: #0c0d0f;       /* 機殼主色：深炭黑霧面烤漆 */
    --case-hi: #16181d;    /* 機殼上緣環境微反光 */
    --case-lo: #08090b;    /* 機殼下緣深影 */
    --well: #090a0c;       /* 翻牌區內凹深槽 */
    --row: #121316;        /* 單數列底槽 */
    --row-alt: #16181c;    /* 雙數列底槽 */
    --tile-hi: #2a2c31;    /* 字格上半葉片 */
    --tile-mid: #222429;   /* 字格上半漸層底 */
    --tile-lo: #202226;    /* 字格下半葉片 */
    --tile-bot: #181a1e;   /* 字格下半漸層底 */
    --hinge: #070809;      /* 轉軸中縫深槽 */
    --pin: #3e4149;        /* 轉軸兩側金屬卡榫 */
    --ink: #f1ede3;        /* 字格文字（暖白高對比） */
    --muted: #7c7f87;      /* 次要指標文字（霧灰） */
    --sign: #f5c518;       /* 機場黃（標題、狀態閃燈、底部廣播條） */
    --ty: #5ccf9c;         /* 道謝 TY（薄荷綠） */
    --lv: #ff86a6;         /* 道愛 LV（櫻花粉） */
    --font-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--case);
    color: var(--ink);
    font-family: var(--font-zh);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--case-hi) 0%, var(--case) 18%, var(--case-lo) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
  }

  /* ===== 標頭（航廈燈箱銘牌） ===== */
  header {
    display: flex;
    align-items: center;
    gap: 1.5vw;
    padding: 1.5vh 2.4vw;
    background: linear-gradient(180deg, rgba(255, 255, 255, .03) 0%, rgba(0, 0, 0, .25) 100%);
    border-bottom: 1px solid #22242a;
  }
  .pict {
    width: 8.4vh;
    height: 8.4vh;
    background: linear-gradient(180deg, #ffd438 0%, var(--sign) 100%);
    border-radius: .8vh;
    border: 1px solid rgba(255, 255, 255, .25);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 .4vh 1vh rgba(0, 0, 0, .5);
    display: grid;
    place-items: center;
    flex: none;
  }
  .pict svg { width: 68%; height: 68%; }
  .title { display: flex; flex-direction: column; line-height: 1; }
  .title .zh {
    font-size: 5.5vh;
    font-weight: 900;
    color: var(--sign);
    letter-spacing: .12em;
    text-shadow: 0 2px 6px rgba(0, 0, 0, .45);
  }
  .title .en {
    font-family: var(--font-sign);
    font-size: 2.7vh;
    font-weight: 700;
    color: var(--sign);
    letter-spacing: .3em;
    text-transform: uppercase;
    margin-top: .5vh;
  }
  .event {
    margin-left: 1.2vw;
    padding-left: 1.6vw;
    border-left: 2px solid #2a2c31;
    line-height: 1.32;
  }
  .event b {
    display: block;
    font-size: 2.85vh;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: .08em;
  }
  .event span {
    display: block;
    font-family: var(--font-sign), var(--font-zh);
    font-size: 1.85vh;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .2em;
    margin-top: .2vh;
  }
  .clockbox { margin-left: auto; display: flex; align-items: center; gap: 1.2vw; }
  .sound-btn {
    background: #1c1e22;
    color: var(--sign);
    border: 1.5px solid var(--sign);
    border-radius: .7vh;
    padding: .85vh 1.15vw;
    font: 700 1.95vh var(--font-zh);
    letter-spacing: .08em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: .5vw;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    transition: background .2s, color .2s, border-color .2s, transform .12s;
  }
  .sound-btn.on {
    background: #17191d;
    color: var(--ink);
    border-color: #2f3238;
  }
  .sound-btn:hover { border-color: var(--sign); }
  .sound-btn:active { transform: scale(.98); }
  .date {
    text-align: right;
    font-family: var(--font-sign);
    color: var(--muted);
    font-size: 2.2vh;
    font-weight: 600;
    letter-spacing: .14em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .date b {
    display: block;
    color: var(--ink);
    font-size: 2.9vh;
    font-weight: 700;
    letter-spacing: .1em;
  }
  #clock { --ch: 7.0vh; }

  /* ===== 欄位標題（工業銘牌橫條） ===== */
  .grid {
    display: grid;
    grid-template-columns: var(--c-flight) var(--c-to) var(--c-msg) 1fr;
    column-gap: var(--col-gap);
    align-items: center;
  }
  .colhead {
    padding: .85vh 2.4vw;
    background: #17181b;
    border-top: 1px solid rgba(255, 255, 255, .07);
    border-bottom: 2px solid #090a0c;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    z-index: 2;
  }
  .colhead div {
    display: flex;
    align-items: baseline;
    gap: .55vw;
    line-height: 1.1;
  }
  .colhead b {
    font-size: 2.05vh;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: .24em;
  }
  .colhead span {
    font-family: var(--font-sign);
    font-size: 1.75vh;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .24em;
  }
  .colhead .right { justify-content: flex-end; text-align: right; }

  /* ===== 看板內凹字槽 ===== */
  main {
    flex: 1;
    margin: .9vh 1.6vw;
    padding: 0 .8vw;
    background: var(--well);
    border-radius: .9vh;
    border: 1.5px solid #25272d;
    box-shadow: inset 0 3px 10px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .05);
    overflow: hidden;
  }
  .row {
    height: var(--row-h);
    padding-block: calc(var(--row-h) * .08);
    padding-inline: .6vw;
    background: var(--row);
    border-top: 1px solid rgba(255, 255, 255, .03);
    border-bottom: 1px solid rgba(0, 0, 0, .75);
    overflow: hidden;
  }
  .row:nth-child(even) { background: var(--row-alt); }
  .row.slide { animation: slide .42s cubic-bezier(.22, 1, .36, 1) both; }
  @keyframes slide { from { height: 0; padding-block: 0; opacity: 0; } }

  /* ===== 翻牌字格：上半＋下半，中軸金屬卡榫，中英數基線對齊 ===== */
  .flaps { display: flex; gap: calc(var(--ch) * .07); }
  .flap {
    position: relative;
    width: calc(var(--ch) * .8);
    height: var(--ch);
    perspective: calc(var(--ch) * 6.5);
    font-family: var(--font-zh);
    font-size: calc(var(--ch) * .64);
    font-weight: 900;
    color: var(--ink);
    border-radius: calc(var(--ch) * .08);
    box-shadow:
      0 calc(var(--ch) * .05) calc(var(--ch) * .08) rgba(0, 0, 0, .72),
      0 0 0 1px rgba(0, 0, 0, .85);
    user-select: none;
  }
  /* 窄格（航班號、時鐘）：Barlow Condensed 等寬工業窄體，與中文方正黑體框高一致 */
  .flap.n {
    width: calc(var(--ch) * .56);
    font-family: var(--font-sign);
    font-size: calc(var(--ch) * .78);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .flap.blank { opacity: .48; }
  .h {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .h b {
    position: absolute;
    left: 0;
    right: 0;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: inherit;
    line-height: 1;
    /* 光學置中微調：讓繁體漢字與英數重心落在轉軸線上 */
    transform: translateY(-1%);
  }
  .flap.n .h b {
    transform: translateY(0%);
  }
  .up, .lu {
    top: 0;
    background: linear-gradient(180deg, var(--tile-hi) 0%, var(--tile-mid) 100%);
    border-radius: calc(var(--ch) * .08) calc(var(--ch) * .08) 0 0;
    border-top: 1px solid rgba(255, 255, 255, .12);
    transform-origin: 50% 100%;
  }
  .lo, .ll {
    bottom: 0;
    background: linear-gradient(180deg, var(--tile-lo) 0%, var(--tile-bot) 100%);
    border-radius: 0 0 calc(var(--ch) * .08) calc(var(--ch) * .08);
    border-bottom: 1px solid rgba(0, 0, 0, .45);
    transform-origin: 50% 0%;
  }
  .lo b, .ll b { top: -100%; }
  /* 轉軸中縫與左右金屬軸銷 */
  .flap::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: calc(50% - 1px);
    height: 2px;
    background: var(--hinge);
    z-index: 4;
  }
  .flap::before {
    content: "";
    position: absolute;
    top: calc(50% - 3px);
    left: -1px;
    width: 3px;
    height: 6px;
    background: var(--pin);
    border-radius: 1px;
    box-shadow: calc(var(--w-tile, var(--ch) * .8) - 1px) 0 0 var(--pin);
    z-index: 5;
  }
  .flap.n::before {
    box-shadow: calc(var(--ch) * .56 - 1px) 0 0 var(--pin);
  }
  .lu, .ll {
    display: none;
    z-index: 3;
    will-change: transform, filter;
  }

  .flight .flap, .to .flap { color: var(--c); }
  .ty { --c: var(--ty); }
  .lv { --c: var(--lv); }

  /* ===== 狀態欄 ===== */
  .status {
    justify-self: end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.08;
    white-space: nowrap;
  }
  .status b {
    font-size: calc(var(--row-h) * .40);
    font-weight: 900;
    color: var(--muted);
    letter-spacing: .12em;
  }
  .status span {
    font-family: var(--font-sign);
    font-size: calc(var(--row-h) * .26);
    font-weight: 700;
    color: var(--muted);
    letter-spacing: .24em;
  }
  .status.boarding b, .status.boarding span { color: var(--sign); }
  .status.boarding b::before {
    content: "";
    display: inline-block;
    width: .52em;
    height: .52em;
    border-radius: 50%;
    background: var(--sign);
    box-shadow: 0 0 8px var(--sign);
    margin-right: .45em;
    vertical-align: .08em;
    animation: blink .85s ease-in-out infinite alternate;
  }
  .status.boarding { animation: glow .85s ease-in-out infinite alternate; }
  @keyframes blink { to { opacity: .2; } }
  @keyframes glow { to { opacity: .65; } }

  .empty {
    color: var(--muted);
    font-size: 3.0vh;
    font-weight: 700;
    padding: 12vh 0;
    text-align: center;
    letter-spacing: .16em;
  }

  /* ===== 底部廣播跑馬燈（經典機場黃警示條） ===== */
  footer {
    display: flex;
    align-items: stretch;
    height: 6.8vh;
    background: var(--sign);
    border-top: 1px solid rgba(255, 255, 255, .25);
    color: #111;
  }
  .onair {
    flex: none;
    display: flex;
    align-items: center;
    gap: .5vw;
    padding: 0 1.6vw;
    background: #111;
    color: var(--sign);
    font-family: var(--font-sign), var(--font-zh);
    font-size: 2.35vh;
    font-weight: 700;
    letter-spacing: .22em;
    box-shadow: 2px 0 8px rgba(0, 0, 0, .3);
    z-index: 1;
  }
  .ticker {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .ticker-track {
    display: flex;
    white-space: nowrap;
    animation: tick 48s linear infinite;
  }
  .ticker-track span {
    padding-right: 6vw;
    font-size: 2.6vh;
    font-weight: 900;
    color: #111;
    letter-spacing: .06em;
  }
  @keyframes tick { to { transform: translateX(-50%); } }
  .tally {
    flex: none;
    display: flex;
    align-items: center;
    gap: 1.4vw;
    padding: 0 2vw;
    background: #111;
    color: var(--ink);
    font-family: var(--font-sign), var(--font-zh);
    font-size: 2.35vh;
    font-weight: 700;
    letter-spacing: .12em;
    font-variant-numeric: tabular-nums;
  }
  .tally i { font-style: normal; }
  .tally .t { color: var(--ty); }
  .tally .l { color: var(--lv); }
  #offline { color: var(--sign); }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track, .status.boarding, .status.boarding b::before, .row.slide { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="pict" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="#111" d="M2.5 19h19v2h-19zm19.07-9.64c-.21-.8-1.04-1.28-1.84-1.06L14.42 9.7 7.52 3.27l-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49 16.57-4.43c.81-.23 1.28-1.05 1.07-1.85z"/></svg>
    </div>
    <div class="title"><span class="zh">出境</span><span class="en">Departures</span></div>
    <div class="event"><b>候機室的真心話</b><span>前往下一站的登機廣播</span></div>
    <div class="clockbox">
      <button type="button" class="sound-btn" id="soundBtn" title="切換登機廣播與翻牌音效">🔇 點擊啟用音效</button>
      <div class="date"><b id="date">--/--</b><span id="weekday">---</span></div>
      <div id="clock"></div>
    </div>
  </header>

  <div class="grid colhead">
    <div><b>航班</b><span>FLIGHT</span></div>
    <div><b>前往</b><span>TO</span></div>
    <div><b>真心話</b><span>MESSAGE</span></div>
    <div class="right"><b>狀態</b><span>STATUS</span></div>
  </div>

  <main id="board"></main>

  <footer>
    <div class="onair">✈ 廣播 PA</div>
    <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
    <div class="tally"><span id="offline" hidden>⚠ 連線中斷，顯示最後資料</span><i class="t">TY 道謝 <b id="nTy">0</b></i><i class="l">LV 道愛 <b id="nLv">0</b></i><i>已登機 <b id="count">0</b></i></div>
  </footer>

<script src="config.js"></script>
<script>
  // ===== 連線設定：API 網址寫在 config.js =====
  const API = String(window.API_URL || '').trim();
  const LIVE = /^https:\/\/script\.google\.com\//.test(API);   // 沒填網址時跑示範資料
  const apiGet = q => fetch(API + '?api=' + q + '&t=' + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

  // ===== 可調整的參數 =====
  const ROWS = 12;           // 畫面顯示幾列（10–12 筆）
  const POLL_MS = 4000;      // 多久向試算表拉一次資料
  const BOARDING_MS = 8000;  // 新訊息「登機中」閃爍多久
  const INSERT_GAP_MS = 3000;// 多則新訊息同時進來時，每則間隔
  const IDLE_MS = 20000;     // 多久沒有新訊息就開始輪播舊的
  const ROTATE_MS = 7000;    // 輪播間隔
  const FLIP_MS = 68;        // 翻一片的半程時間（配合 Web Animations API 合成層與 C2 軟葉片翻頁感）
  const CELLS = { flight: 6, to: 4, msg: 20 };   // 預設值；連上 API 後會自動改成 Code.gs 的 TO_MAX_LEN、MAX_LEN
  const TICKER = [
    '旅客請注意：如果生命只剩最後一週，你最想對誰說話？',
    '請掃描 QR Code，留下 {n} 字以內的道謝或道愛航程短訊',
    '有些話，別等到終點才說',
    '旅途遇上亂流時，諮商中心隨時為你亮起引導燈',
  ];

  const $ = id => document.getElementById(id);
  const board = $('board');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pool = [], known = new Set(), queue = [], onBoard = [];
  let lastInsert = Date.now(), rotateAt = 0, rotatePtr = 0, loaded = false;

  // ===== 機場廣播叮咚聲與 C2 慢速絲絨軟葉片翻頁鐘音效（Web Audio API 合成） =====
  let audioCtx = null, pinkBuf = null, soundOn = false, lastTickTime = 0;

  function ensureAudio() {
    // 支援 iOS (iPhone/iPad) 即使側邊實體靜音鍵開啟也能正常播放音效
    if (navigator.audioSession) {
      try { navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    // 建立溫暖的粉紅噪音（Pink Noise）基底，作為 C2 軟質翻頁鐘葉片刷動聲
    if (audioCtx && !pinkBuf) {
      const len = Math.floor(audioCtx.sampleRate * 0.25);
      pinkBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const out = pinkBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
        b6 = white * 0.115926;
      }
    }
  }

  // 機場經典雙音階登機廣播鐘聲（Ding-Dong: G5 -> E5）
  function playChime() {
    if (!soundOn || !audioCtx) return;
    ensureAudio();
    const now = audioCtx.currentTime;
    const playBell = (freq, start, dur) => {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, start);
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, start);
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.11, start);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(0.26, start + 0.022);
      gain.gain.exponentialRampToValueAtTime(0.0008, start + dur);

      osc1.connect(gain);
      osc2.connect(g2);
      g2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(start); osc1.stop(start + dur);
      osc2.start(start); osc2.stop(start + dur);
    };
    playBell(783.99, now, 1.15);        // Ding (G5)
    playBell(659.25, now + 0.42, 1.55); // Dong (E5)
  }

  // 款式 C2：復古翻頁鐘・慢速絲絨軟葉片（64ms 間隔、溫潤「嘩～嘩～」軟頁刷動聲）
  function playFlapTick() {
    if (!soundOn || !audioCtx) return;
    const nowMs = performance.now();
    if (nowMs - lastTickTime < 64) return; // C2 慢速柔和間隔（64ms）
    lastTickTime = nowMs;
    ensureAudio();
    if (!pinkBuf) return;

    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = pinkBuf;
    const offset = Math.random() * 0.12;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(610 + Math.random() * 170, now);
    filter.Q.setValueAtTime(0.68, now);

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1240, now);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0005, now);
    gain.gain.linearRampToValueAtTime(0.27, now + 0.014); // 14ms 柔和漸入，無硬質敲擊音
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.078);

    src.connect(filter);
    filter.connect(lp);
    lp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now, offset, 0.082);
  }

  $('soundBtn').addEventListener('click', () => {
    ensureAudio();
    soundOn = !soundOn;
    const btn = $('soundBtn');
    btn.classList.toggle('on', soundOn);
    btn.textContent = soundOn ? '🔊 廣播音效開啟' : '🔇 點擊啟用音效';
    if (soundOn) {
      playChime(); // 立即試播叮咚廣播聲
      // 接著立刻翻動第一列（若尚無留言則翻動時鐘），讓使用者當場聽到「叮咚＋C2 柔和翻頁聲」
      setTimeout(() => {
        const firstRow = board.querySelector('.row');
        if (firstRow) spinRow(firstRow, 0, true);
        else clockTiles.forEach((el, i) => spinTo(el, el.cur || '0', i * 60, 5));
      }, 350);
    }
  });

  // ===== 尺寸：字格大小依列高與可用寬度自動計算 =====
  function layout() {
    const rowH = board.clientHeight / ROWS;
    const cs = getComputedStyle(board);
    const avail = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    // 窄格（英數）寬 .56、中文格寬 .8、格距 .07、欄距 1.3 格、狀態欄約 4.2 格
    const units = CELLS.flight * .63 + (CELLS.to + CELLS.msg) * .87 + 3 * 1.3 + 4.2;
    const ch = Math.min(rowH * .82, avail / units);
    const w = (n, k) => n * ch * (k + .07) + 'px';
    const s = document.documentElement.style;
    s.setProperty('--row-h', rowH + 'px');
    s.setProperty('--ch', ch + 'px');
    s.setProperty('--w-tile', (ch * .8) + 'px');
    s.setProperty('--col-gap', ch * 1.3 + 'px');
    s.setProperty('--c-flight', w(CELLS.flight, .56));
    s.setProperty('--c-to', w(CELLS.to, .8));
    s.setProperty('--c-msg', w(CELLS.msg, .8));
  }

  // ===== 翻牌（Web Animations API GPU 合成層加速＋物理微回彈＋光影漸變） =====
  const NOISE_ZH = '的一是我你謝愛好想家媽爸室友自己記得吃飯辛苦朋友同學老師永遠陪伴感恩', NOISE_EN = 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789';
  const isNarrow = c => /[\x00-\x7f]/.test(c);

  function tile(narrow) {
    const el = document.createElement('span');
    el.className = 'flap' + (narrow ? ' n' : '');
    el.innerHTML = '<span class="h up"><b></b></span><span class="h lo"><b></b></span><span class="h lu"><b></b></span><span class="h ll"><b></b></span>';
    el._nodes = {
      up: el.children[0].firstChild,
      lo: el.children[1].firstChild,
      luWrap: el.children[2],
      lu: el.children[2].firstChild,
      llWrap: el.children[3],
      ll: el.children[3].firstChild
    };
    el.cur = ' ';
    return el;
  }

  function flipTo(el, next, silent) {
    const { up, lo, luWrap, lu, llWrap, ll } = el._nodes;
    const old = el.cur;
    el.cur = next;
    const dispNext = next === ' ' ? '' : next;
    const dispOld = old === ' ' ? '' : old;
    if (reduce || !luWrap.animate) {
      up.textContent = lo.textContent = dispNext;
      return Promise.resolve();
    }
    if (!silent && old !== next) playFlapTick();

    if (el._a1) el._a1.cancel();
    if (el._a2) el._a2.cancel();

    up.textContent = dispNext;
    lo.textContent = dispOld;
    lu.textContent = dispOld;
    ll.textContent = dispNext;
    luWrap.style.display = 'block';
    llWrap.style.display = 'block';

    // 微隨機抖動（±7%），讓整排翻動具有自然機械差速感
    const d = FLIP_MS * (0.93 + Math.random() * 0.14);

    // 上半葉片：重力加速下墜，隨角度轉折逐漸變暗
    el._a1 = luWrap.animate([
      { transform: 'rotateX(0deg)', filter: 'brightness(1)' },
      { transform: 'rotateX(-90deg)', filter: 'brightness(0.55)' }
    ], {
      duration: d,
      easing: 'cubic-bezier(0.55, 0.06, 0.85, 0.36)',
      fill: 'forwards'
    });

    // 下半葉片：承接展開，落地時帶微小機械卡榫回彈（-4.5deg -> 0deg）
    el._a2 = llWrap.animate([
      { transform: 'rotateX(90deg)', filter: 'brightness(0.58)' },
      { transform: 'rotateX(-4.5deg)', filter: 'brightness(1.06)', offset: 0.82 },
      { transform: 'rotateX(0deg)', filter: 'brightness(1)' }
    ], {
      duration: d * 1.12,
      delay: d * 0.92,
      easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
      fill: 'forwards'
    });

    return el._a2.finished.then(() => {
      lo.textContent = dispNext;
      luWrap.style.display = 'none';
      llWrap.style.display = 'none';
      el._a1 = el._a2 = null;
    }).catch(() => {});
  }

  async function spinTo(el, final, delay, steps) {
    if (delay > 0) await new Promise(r => setTimeout(r, delay));
    if (final !== ' ' && !reduce) {
      const noise = isNarrow(final) ? NOISE_EN : NOISE_ZH;
      for (let i = 0; i < steps; i++) {
        await flipTo(el, noise[Math.floor(Math.random() * noise.length)]);
      }
    }
    await flipTo(el, final);
  }

  function flaps(text, cells, cls, narrowCol) {
    const wrap = document.createElement('div');
    wrap.className = 'flaps ' + cls;
    const chars = Array.from(text);
    for (let i = 0; i < cells; i++) {
      const c = chars[i] || ' ';
      const el = tile(narrowCol);
      if (!chars[i]) el.classList.add('blank');
      el.dataset.final = c;
      wrap.appendChild(el);
    }
    return wrap;
  }

  function spinRow(row, rowDelay = 0, fullSpin = true) {
    const baseSteps = fullSpin ? 3 : 2;
    const modSteps = fullSpin ? 5 : 3;
    row.querySelectorAll('.flap').forEach((el, i) => {
      const steps = el.dataset.final === ' ' ? 0 : baseSteps + (i % modSteps) + Math.floor(Math.random() * 2);
      spinTo(el, el.dataset.final, rowDelay + i * 36, steps);
    });
  }

  const flightNo = m => (m.love ? 'LV' : 'TY') + '-' + String(m.id - 1).padStart(3, '0');

  function makeRow(m, boarding, rowDelay = 0, fullSpin = true) {
    const row = document.createElement('div');
    row.className = 'row grid slide ' + (m.love ? 'lv' : 'ty');
    row.dataset.id = m.id;
    const st = document.createElement('div');
    const setStatus = b => {
      st.className = 'status' + (b ? ' boarding' : '');
      st.innerHTML = b ? '<b>登機中</b><span>BOARDING</span>' : '<b>已登機</b><span>DEPARTED</span>';
    };
    setStatus(boarding);
    row.append(
      flaps(flightNo(m), CELLS.flight, 'flight', true),
      flaps(m.to, CELLS.to, 'to', false),
      flaps(m.text, CELLS.msg, 'msg', false),
      st);
    if (boarding) {
      playChime(); // 新訊息登機時響起機場叮咚廣播聲
      setTimeout(() => setStatus(false), BOARDING_MS);
    }
    spinRow(row, rowDelay, fullSpin);
    return row;
  }

  function pushTop(m, boarding) {
    board.querySelector('.empty')?.remove();
    board.querySelector(`.row[data-id="${m.id}"]`)?.remove();
    board.prepend(makeRow(m, boarding, 0, true));
    while (board.children.length > ROWS) board.lastElementChild.remove();
    onBoard = [...board.children].map(r => +r.dataset.id);
  }

  function renderInitial() {
    board.innerHTML = '';
    if (!pool.length) { board.innerHTML = '<div class="empty">候機中⋯⋯等待第一位旅客留下真心話</div>'; return; }
    // 初次載入由上而下錯開啟動，避免所有字格同一毫秒齊翻造成卡頓
    pool.slice(0, ROWS).forEach((m, idx) => board.appendChild(makeRow(m, false, idx * 85, false)));
    onBoard = pool.slice(0, ROWS).map(m => m.id);
    rotatePtr = ROWS;
  }

  // ===== 資料 =====
  function onData(list) {
    $('offline').hidden = true;
    try { localStorage.setItem('boardCache', JSON.stringify(list)); } catch (e) {}
    ingest(list);
  }
  function ingest(list) {
    const ids = new Set(list.map(m => m.id));
    [...board.querySelectorAll('.row')].forEach(r => { if (!ids.has(+r.dataset.id)) r.remove(); }); // 撤下的立即移除
    queue = queue.filter(m => ids.has(m.id));
    const fresh = list.filter(m => !known.has(m.id));
    list.forEach(m => known.add(m.id));
    pool = list;
    $('count').textContent = pool.length;
    $('nTy').textContent = pool.filter(m => !m.love).length;
    $('nLv').textContent = pool.filter(m => m.love).length;
    if (!loaded) { loaded = true; renderInitial(); return; }
    queue.push(...fresh.reverse());
    if (!board.querySelector('.row') && !queue.length) renderInitial();
  }
  function onFail(err) { console.error(err); $('offline').hidden = false; }

  function poll() {
    if (LIVE) apiGet('messages').then(onData).catch(onFail);
    else demo();
  }

  // ===== 排程：新訊息優先，閒置時輪播舊的 =====
  function scheduler() {
    const now = Date.now();
    if (queue.length && now - lastInsert >= INSERT_GAP_MS) {
      pushTop(queue.shift(), true);
      lastInsert = now; rotateAt = now + IDLE_MS;
      return;
    }
    if (!queue.length && pool.length >= 1 && now - lastInsert >= IDLE_MS && now >= rotateAt) {
      let m;
      if (pool.length > ROWS) {
        for (let t = 0; t < pool.length && !m; t++) {
          const c = pool[rotatePtr++ % pool.length];
          if (!onBoard.includes(c.id)) m = c;
        }
      } else {
        m = pool.find(p => p.id === onBoard[onBoard.length - 1]);
      }
      if (m) pushTop(m, false);
      rotateAt = now + ROTATE_MS;
    }
  }

  // ===== 時鐘（也是翻牌） =====
  const clockTiles = [];
  function buildClock() {
    const wrap = $('clock');
    wrap.className = 'flaps';
    for (let i = 0; i < 5; i++) { const t = tile(true); wrap.appendChild(t); clockTiles.push(t); }
  }
  function tick() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    Array.from(p(d.getHours()) + ':' + p(d.getMinutes())).forEach((c, i) => { if (clockTiles[i].cur !== c) flipTo(clockTiles[i], c); });
    $('date').textContent = p(d.getMonth() + 1) + '/' + p(d.getDate());
    $('weekday').textContent = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][d.getDay()];
  }

  function buildTicker() {
    const html = TICKER.map(t => `<span>${t.replace('{n}', CELLS.msg)}</span>`).join('');
    $('ticker').innerHTML = html + html; // 兩份接起來無縫循環
  }

  // ===== 直接用瀏覽器開這個檔案時的示範資料 =====
  const DEMO = [['室友', '謝謝你買的宵夜', 0], ['媽媽', '記得吃飯，愛你啦', 1], ['自己', '謝謝當初那個沒有放棄的自己', 0],
    ['阿嬤', '好想再吃你煮的飯', 1], ['學長', '謝謝你帶我飛', 0], ['爸', '你辛苦了，愛你', 1], ['班導', '謝謝你相信我', 0],
    ['好朋友', '大學能遇到你真的太好了', 1], ['自己', '你已經很酷了', 1], ['高中同學', '謝謝你在我最低潮時接住我', 0],
    ['弟弟', '要照顧好自己', 1], ['社團夥伴', '謝謝一起熬夜', 0], ['貓咪', '謝謝你陪我', 0], ['男友', '有你真好', 1]];
  let demoN = 9;
  function demo() {
    if (loaded && demoN < DEMO.length && Math.random() < .35) demoN++;
    onData(DEMO.slice(0, demoN).map((d, i) => ({ id: i + 2, to: d[0], text: d[1], love: !!d[2] })).reverse());
  }

  layout(); addEventListener('resize', layout); new ResizeObserver(layout).observe(board);
  buildClock(); tick(); setInterval(tick, 5000);
  buildTicker();
  function start() {
    try { const c = JSON.parse(localStorage.getItem('boardCache')); if (c && LIVE) ingest(c); } catch (e) {}
    poll(); setInterval(poll, POLL_MS);
  }
  // 字格數量跟著 Code.gs 的字數設定走，只要改 Code.gs 一個地方
  if (LIVE) {
    apiGet('config')
      .then(c => { CELLS.msg = c.maxLen || CELLS.msg; CELLS.to = c.toMaxLen || CELLS.to; layout(); buildTicker(); })
      .catch(() => {})
      .then(start);
  } else start();
  setInterval(scheduler, 500);
</script>
</body>
</html>
